<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="The Cybersecurity Club at Utah Valley University.">
    <title>The Cybersecurity Club at UVU</title>
    <link rel="stylesheet" href="./output.css">
    <link rel="icon" type="image/png" href="./files/CYSCUVU-Logo-Favi.png">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css">
</head>
<body class="min-h-screen bg-black text-white">
    <div class="mx-auto flex min-h-screen max-w-6xl flex-col px-6 sm:px-10">
        <header class="flex items-center justify-between border-b border-white/10 py-6">
            <a href="./" class="flex items-center gap-3" aria-label="CYSCUVU home">
                <img class="h-10 w-10 object-contain" src="./files/CYSCUVU-Logo-Blank.png" alt="">
                <span class="font-arcade text-sm tracking-wider text-cysc-green sm:text-base">CYSCUVU</span>
            </a>

            <nav class="flex items-center gap-5 text-xl text-white/50" aria-label="Social links">
                <a class="transition-colors hover:text-cysc-green" href="https://discord.gg/kJw7UdGSF4" aria-label="Join CYSCUVU on Discord">
                    <i class="fab fa-discord" aria-hidden="true"></i>
                </a>
                <a class="transition-colors hover:text-cysc-green" href="https://github.com/CYSCUVU" aria-label="Visit CYSCUVU on GitHub">
                    <i class="fab fa-github" aria-hidden="true"></i>
                </a>
                <a class="transition-colors hover:text-cysc-green" href="https://www.linkedin.com/company/cyscuvu" aria-label="Visit CYSCUVU on LinkedIn">
                    <i class="fab fa-linkedin" aria-hidden="true"></i>
                </a>
            </nav>
        </header>

        <main class="flex flex-1 items-center py-16 sm:py-24">
            <section class="max-w-4xl">
                <p class="mb-5 font-tommy text-sm font-bold uppercase tracking-[0.25em] text-cysc-green sm:text-base">
                    Utah Valley University
                </p>

                <h1 class="font-arcade text-4xl leading-tight text-cysc-green drop-shadow-[0_0_12px_rgba(23,149,99,0.45)] sm:text-6xl lg:text-7xl">
                    CYSCUVU
                </h1>

                <p class="mt-8 max-w-3xl font-tommy text-xl leading-relaxed text-white/70 sm:text-2xl lg:text-3xl">
                    A student-run club for learning, practicing, and exploring
                    <span class="text-white">cybersecurity, hacking, and information security.</span>
                </p>

                <a class="mt-10 inline-flex items-center gap-3 rounded-md bg-cysc-green px-6 py-3 font-tommy text-lg font-bold text-black transition hover:bg-white focus:outline-none focus:ring-2 focus:ring-cysc-green focus:ring-offset-4 focus:ring-offset-black" href="https://discord.gg/kJw7UdGSF4">
                    Join the club
                    <i class="fab fa-discord" aria-hidden="true"></i>
                </a>
            </section>
        </main>

        <footer class="border-t border-white/10 py-6 font-tommy text-sm text-white/40">
            Cybersecurity Club at Utah Valley University
        </footer>
    </div>
</body>
</html>
